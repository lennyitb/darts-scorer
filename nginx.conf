# Serves the static scorer. Every asset path in index.html is relative, so the
# app works unchanged at the root of a host or behind a reverse proxy that
# mounts it under a subpath (e.g. proxy_pass http://127.0.0.1:8090/ from
# location /darts/).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types image/svg+xml;  # text/html is always included

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
        # Revalidate on every load so a redeploy shows up immediately; the
        # whole app is ~30 KB, so there is nothing worth caching harder.
        add_header Cache-Control "no-cache" always;
    }
}
