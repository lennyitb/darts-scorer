<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darts scorer</title>
<meta name="description" content="A darts scorer for 301, 501 and 701 with checkout suggestions, ranked games and stats.">
<meta name="theme-color" content="#ece3cd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18201c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app">
  <nav class="topnav" aria-label="Main">
    <a class="brand" href="#/"><img src="favicon.svg" alt="" width="22" height="22"><span>Darts</span></a>
    <a href="#/" data-nav="play">Play</a>
    <a href="#/history" data-nav="history">History</a>
    <a href="#/players" data-nav="players">Players</a>
    <span class="spacer"></span>
    <button class="ghost screen" id="screenBtn" aria-label="Big screen" title="Big screen" hidden><svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="1" y="1" width="16" height="10.5" rx="1.5"/><path d="M6 15h6M9 11.5V15"/></svg><span>Big screen</span></button>
    <button class="ghost acct" id="acctBtn" hidden>Sign in</button>
  </nav>
  <div id="bigbar" hidden></div>
  <div id="game" hidden>
    <header>
      <div class="game-badge" id="badge">501</div>
      <div class="rules" id="rules"></div>
      <button class="ghost" id="newBtn">New game</button>
    </header>
    <main class="board">
      <div class="players" id="players"></div>
      <div class="pad" id="pad"></div>
    </main>
    <div class="banner" id="banner" role="status" aria-live="polite"></div>
    <div class="typing" id="typing" hidden></div>
  </div>
  <div id="keypad" hidden></div>
  <div class="overlay" id="setup" hidden></div>
  <div id="view" hidden></div>
</div>
<div class="overlay" id="modal" hidden></div>
<div class="overlay" id="dialog" hidden></div>
<canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
</body>
</html>
