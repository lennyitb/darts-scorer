<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darts scorer</title>
<meta name="description" content="A darts scorer for 301, 501 and 701 with checkout suggestions.">
<meta name="theme-color" content="#ece3cd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18201c" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece3cd; --surface:#f8f3e6; --surface2:#e2d7bc; --ink:#1b221e; --muted:#5b645d; --line:#cdbf9f;
  --red:#b01f29; --red-ink:#fff; --green:#1c6b43; --green-ink:#fff; --key:#fffcf3; --key-ink:#1b221e;
  --shadow:0 1px 0 rgba(60,45,20,.18);
  --cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18201c; --surface:#212b26; --surface2:#2b3731; --ink:#ecebe2; --muted:#98a39c; --line:#35423c;
    --red:#d8414a; --green:#34a168; --key:#2a3530; --key-ink:#ecebe2; --shadow:0 1px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#18201c; --surface:#212b26; --surface2:#2b3731; --ink:#ecebe2; --muted:#98a39c; --line:#35423c;
  --red:#d8414a; --green:#34a168; --key:#2a3530; --key-ink:#ecebe2; --shadow:0 1px 0 rgba(0,0,0,.35);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
[hidden]{display:none!important}

.app{max-width:1100px;margin:0 auto;padding:12px 14px 20px;min-height:100%;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:12px}
.game-badge{font-family:var(--cond);font-weight:800;font-size:28px;line-height:1;background:var(--ink);color:var(--bg);padding:6px 10px 5px;border-radius:6px}
.rules{color:var(--muted);font-size:14px;flex:1;min-width:0}
.rules b{color:var(--ink);font-weight:600}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:500}

main{display:grid;gap:14px;flex:1}
@media (min-width:820px){main{grid-template-columns:1fr 440px;align-items:start}}

/* Players */
.players{display:flex;flex-direction:column;gap:8px}
.player{background:var(--surface);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;border-left:6px solid transparent}
.player .p-name{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .p-rem{font-family:var(--cond);font-weight:700;font-size:40px;line-height:1;grid-row:span 2;font-variant-numeric:tabular-nums}
.player .p-meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.player .co,.player .note{grid-column:1/-1}
.player.is-active{border-left-color:var(--green);padding:14px 16px 16px;grid-template-columns:1fr}
.player.is-active .p-rem{font-size:clamp(84px,24vw,150px);grid-row:auto;letter-spacing:-.01em;margin:2px 0 4px}
.player.is-active .p-name{font-size:19px}
.throwing{font-size:13px;color:var(--green);font-weight:600;margin-left:8px}
.legs{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.legs i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.legs i.won{background:var(--green);border-color:var(--green)}
.co{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.co span{font-size:13px;color:var(--muted);margin-right:2px}
.co b{font-family:var(--cond);font-weight:700;font-size:18px;padding:2px 9px;border-radius:5px;background:var(--surface2)}
.co b.t{background:var(--red);color:var(--red-ink)}
.co b.d{background:var(--green);color:var(--green-ink)}
.player:not(.is-active) .co b{font-size:14px;padding:1px 6px}
.note{font-size:13px;color:var(--red);margin-top:4px;font-weight:500}

/* Pad */
.pad{background:var(--surface);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:8px;border-radius:7px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--key);box-shadow:var(--shadow)}
.entry{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:58px;padding:0 4px}
.entry .buf{font-family:var(--cond);font-weight:700;font-size:48px;line-height:1.1;font-variant-numeric:tabular-nums}
.entry .buf.empty{color:var(--muted);font-weight:500;font-size:22px}
.entry .leaves{color:var(--muted);font-size:15px;text-align:right}
.entry .leaves.bad{color:var(--red);font-weight:600}
.grid{display:grid;gap:6px}
.g5{grid-template-columns:repeat(5,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.k{background:var(--key);color:var(--key-ink);border:0;border-radius:9px;box-shadow:var(--shadow);min-height:52px;font-family:var(--cond);font-weight:700;font-size:24px;padding:4px}
.k:active{transform:translateY(1px);filter:brightness(.95)}
.k.q{font-size:20px;min-height:44px;background:var(--surface2)}
.k.small{font-family:var(--body);font-size:15px;font-weight:600}
.k.go{background:var(--green);color:var(--green-ink);font-family:var(--body);font-size:17px;font-weight:600}
.k.undo{font-family:var(--body);font-size:15px;font-weight:600}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mods button{border:2px solid var(--line);background:none;border-radius:9px;padding:9px 4px;font-weight:600}
.mods button[aria-pressed="true"][data-m="1"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.mods button[aria-pressed="true"][data-m="2"]{border-color:var(--green);background:var(--green);color:var(--green-ink)}
.mods button[aria-pressed="true"][data-m="3"]{border-color:var(--red);background:var(--red);color:var(--red-ink)}
.darts{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:6px;align-items:center}
.slot{border:2px dashed var(--line);border-radius:9px;height:48px;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:24px}
.slot.full{border-style:solid;border-color:transparent;background:var(--surface2)}
.slot.t{background:var(--red);color:var(--red-ink)}
.slot.d{background:var(--green);color:var(--green-ink)}
.turn-total{font-family:var(--cond);font-weight:700;font-size:30px;min-width:56px;text-align:right;padding-right:4px}
.msg{min-height:22px;font-weight:600;text-align:center;font-size:15px}
.msg.bad{color:var(--red)} .msg.good{color:var(--green)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sheet h2{font-family:var(--cond);font-weight:800;font-size:34px;line-height:1.05;margin:0 0 6px}
.sheet p{margin:0 0 14px;color:var(--muted)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;font-size:16px;background:var(--surface2);flex:1}
.btn.primary{background:var(--green);color:var(--green-ink)}
.btn.danger{background:none;border:2px solid var(--red);color:var(--red)}
.field{margin-bottom:16px}
.field > label,.field > .lbl{display:block;font-weight:600;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:2px solid var(--line);background:none;border-radius:9px;padding:8px 14px;font-weight:600;min-width:52px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.big button{font-family:var(--cond);font-size:26px;font-weight:800;padding:6px 18px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle small{display:block;color:var(--muted);font-weight:400}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{left:25px}
.names{display:flex;flex-direction:column;gap:6px}
.names div{display:flex;gap:6px}
.names input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--key);color:var(--ink)}
.names button{border:0;background:var(--surface2);border-radius:9px;width:44px;font-size:20px}
.add{margin-top:6px;border:1.5px dashed var(--line);background:none;border-radius:9px;padding:9px;width:100%;font-weight:600;color:var(--muted)}
.tablewrap{overflow-x:auto;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="game" hidden>
    <header>
      <div class="game-badge" id="badge">501</div>
      <div class="rules" id="rules"></div>
      <button class="ghost" id="newBtn">New game</button>
    </header>
    <main style="margin-top:12px">
      <div class="players" id="players"></div>
      <div class="pad" id="pad"></div>
    </main>
  </div>
</div>
<div class="overlay" id="setup" hidden></div>
<div class="overlay" id="modal" hidden></div>
<canvas id="confetti" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20"></canvas>

<script>
(function(){
const LS='darts-scorer-v1';
const IMPOSSIBLE=new Set([163,166,169,172,173,175,176,178,179]);
const QUICK=[0,26,41,45,60,81,85,100,140,180];
let state=null, history=[], setupOpen=false, draft=null, buffer='', mult=1, pending=null, msg=null, msgTimer=null;

/* ---------- Checkout engine ---------- */
const SETUP=[];
for(let n=20;n>=1;n--) SETUP.push({l:'T'+n,s:3*n,c:n>=19?2:n>=17?3:4});
for(let n=20;n>=1;n--) SETUP.push({l:String(n),s:n,c:1});
SETUP.push({l:'25',s:25,c:3},{l:'Bull',s:50,c:6});
for(let n=20;n>=1;n--) SETUP.push({l:'D'+n,s:2*n,c:5});
const DPREF={20:0,16:0,8:1,10:1,18:1,12:1,4:2,6:2,14:2,2:3,1:5};
const FIN=new Map();
for(let n=1;n<=20;n++) FIN.set(2*n,{l:'D'+n,c:DPREF[n]??3});
FIN.set(50,{l:'Bull',c:5});
const coCache=new Map();
function checkout(rem,left){
  if(rem<2||rem>170||left<1) return null;
  const key=rem+'|'+left; if(coCache.has(key)) return coCache.get(key);
  let best=null,bc=Infinity;
  const f1=FIN.get(rem); if(f1){best=[f1.l];bc=f1.c;}
  if(left>=2) for(const a of SETUP){const f=FIN.get(rem-a.s); if(f){const c=a.c+f.c+3; if(c<bc){bc=c;best=[a.l,f.l];}}}
  if(left>=3) for(const a of SETUP) for(const b of SETUP){ if(b.s>a.s) continue; const f=FIN.get(rem-a.s-b.s); if(f){const c=a.c+b.c+f.c+6; if(c<bc){bc=c;best=[a.l,b.l,f.l];}}}
  coCache.set(key,best); return best;
}
function minDarts(v,doubleOut){
  if(doubleOut){const c=checkout(v,3); return c?c.length:0;}
  if(v<=0) return 0; return v<=60?1:v<=120?2:v<=180?3:0;
}

/* ---------- State ---------- */
function save(){try{localStorage.setItem(LS,JSON.stringify({state,history:history.slice(-60)}));}catch(e){}}
function load(){try{const r=JSON.parse(localStorage.getItem(LS)||'null'); if(r&&r.state){state=r.state;history=r.history||[];}}catch(e){}}
function snap(){history.push(JSON.stringify(state)); if(history.length>300) history.shift();}
function cur(){return state.players[state.current];}
const clone=o=>JSON.parse(JSON.stringify(o));

function newGame(cfg,starter=0){
  const mode=state?state.mode:'total';
  state={config:clone(cfg),mode,current:starter,legStarter:starter,leg:1,turn:[],legWinner:null,matchWinner:null,lastCheckout:null,
    players:cfg.names.map(n=>({name:n,remaining:cfg.start,opened:!cfg.doubleIn,legs:0,last:null,
      st:{pts:0,darts:0,hi:0,t100:0,t140:0,t180:0,hiOut:0}}))};
  history=[];buffer='';mult=1;pending=null;save();
}

function evalDarts(p,darts){
  const cfg=state.config;
  let rem=p.remaining,opened=p.opened,pts=0;
  for(let i=0;i<darts.length;i++){
    const d=darts[i]; let s=d.s;
    if(!opened){ if(d.dbl) opened=true; else s=0; }
    const nr=rem-s;
    if(nr<0||(cfg.doubleOut&&nr===1)||(nr===0&&cfg.doubleOut&&!d.dbl)) return {bust:true,n:i+1};
    rem=nr; pts+=s;
    if(rem===0) return {checkout:true,pts,rem,opened,n:i+1};
  }
  return {pts,rem,opened,n:darts.length};
}

function commit({pts,darts,bust,checkout:co,opened}){
  const p=cur(), st=p.st;
  st.darts+=darts;
  if(bust){p.last='Bust'; say(p.name+' bust','bad');}
  else{
    p.remaining-=pts; st.pts+=pts; if(opened) p.opened=true; p.last=pts;
    st.hi=Math.max(st.hi,pts);
    if(pts===180) st.t180++; else if(pts>=140) st.t140++; else if(pts>=100) st.t100++;
    if(pts===180) say('One hundred and eighty!','good');
  }
  state.turn=[]; mult=1;
  if(co){
    p.legs++; st.hiOut=Math.max(st.hiOut,pts);
    state.lastCheckout={player:state.current,pts,darts};
    if(p.legs>=state.config.legsToWin){state.matchWinner=state.current; confetti();} else state.legWinner=state.current;
    return;
  }
  state.current=(state.current+1)%state.players.length;
}

// Loser of the match: fewest legs won; ties go to whoever was furthest from finishing.
function loserIndex(){
  let li=0;
  state.players.forEach((p,i)=>{const l=state.players[li];
    if(i===state.matchWinner) return;
    if(li===state.matchWinner||p.legs<l.legs||(p.legs===l.legs&&p.remaining>l.remaining)) li=i;});
  return li;
}

function nextLeg(){
  state.players.forEach(p=>{p.remaining=state.config.start;p.opened=!state.config.doubleIn;p.last=null;});
  state.legStarter=(state.legStarter+1)%state.players.length;
  state.current=state.legStarter; state.leg++; state.legWinner=null; state.turn=[];
  history=[]; save(); render();
}

function undo(){
  if(pending){pending=null;render();return;}
  if(buffer){buffer='';render();return;}
  if(!history.length){say('Nothing to undo','bad');return;}
  state=JSON.parse(history.pop()); mult=1; if(state.matchWinner==null) stopConfetti(); save(); render();
}

/* ---------- Input ---------- */
function submitTotal(v){
  if(state.legWinner!=null||state.matchWinner!=null) return;
  if(!Number.isInteger(v)) return;
  if(v>180||IMPOSSIBLE.has(v)){say(v+" isn't possible with three darts",'bad');buffer='';render();return;}
  const p=cur(), cfg=state.config;
  const opened=p.opened||v>0;
  const nr=p.remaining-v;
  buffer='';
  if(nr<0||(cfg.doubleOut&&nr===1)){snap();commit({pts:0,darts:3,bust:true});save();render();return;}
  if(nr===0){
    const md=minDarts(v,cfg.doubleOut);
    if(!md){snap();commit({pts:0,darts:3,bust:true});say(v+" can't be checked out, so that's a bust",'bad');save();render();return;}
    pending={v,min:md,opened};render();return;
  }
  snap();commit({pts:v,darts:3,opened});save();render();
}
function confirmCheckout(n){
  const {v,opened}=pending; pending=null;
  snap();commit({pts:v,darts:n,checkout:true,opened});save();render();
}
function pendingBust(){pending=null;snap();commit({pts:0,darts:3,bust:true});save();render();}

function addDart(m,n){
  if(state.legWinner!=null||state.matchWinner!=null) return;
  let d;
  if(n===0) d={l:'Miss',s:0,dbl:false};
  else if(n===25) d={l:'25',s:25,dbl:false};
  else if(n===50) d={l:'Bull',s:50,dbl:true};
  else d={l:(m===3?'T':m===2?'D':'')+n,s:n*m,dbl:m===2};
  snap(); state.turn.push(d); mult=1;
  const r=evalDarts(cur(),state.turn);
  if(r.bust) commit({pts:0,darts:r.n,bust:true});
  else if(r.checkout) commit({pts:r.pts,darts:r.n,checkout:true,opened:true});
  else if(state.turn.length===3) commit({pts:r.pts,darts:3,opened:r.opened});
  save(); render();
}
function endTurnEarly(){
  if(!state.turn.length) return;
  snap(); const r=evalDarts(cur(),state.turn);
  commit({pts:r.pts,darts:3,opened:r.opened}); save(); render();
}

/* ---------- Confetti ---------- */
let confettiRun=0;
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'), ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1, W=innerWidth, H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  const colors=[cs.getPropertyValue('--red'),cs.getPropertyValue('--green'),'#f3e6c4','#1b221e','#e8b93a'].map(c=>c.trim());
  const parts=[];
  const burst=(x,dir)=>{for(let i=0;i<110;i++){const a=(-90+dir*(20+Math.random()*40))*Math.PI/180, v=9+Math.random()*9;
    parts.push({x,y:H+10,vx:Math.cos(a)*v,vy:Math.sin(a)*v*1.35,w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:colors[i%colors.length],o:1});}};
  burst(W*0.05,1); burst(W*0.95,-1);
  setTimeout(()=>{for(let i=0;i<90;i++) parts.push({x:Math.random()*W,y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:colors[i%colors.length],o:1});},350);
  const id=++confettiRun, t0=performance.now();
  (function frame(t){
    if(id!==confettiRun) return;
    ctx.clearRect(0,0,W,H);
    const age=t-t0;
    for(const p of parts){
      p.vy+=0.28; p.vx*=0.985; p.vy=Math.min(p.vy,6+Math.abs(p.vx)); p.x+=p.vx+Math.sin((age+p.r*100)/260)*0.8; p.y+=p.vy; p.r+=p.vr;
      if(age>3800) p.o=Math.max(0,p.o-0.02);
      ctx.save(); ctx.globalAlpha=p.o; ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.scale(1,Math.cos(p.r*2));
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if(age<5500) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })(t0);
}
function stopConfetti(){confettiRun++; const cv=document.getElementById('confetti'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}

function say(t,kind){msg={t,kind}; clearTimeout(msgTimer); msgTimer=setTimeout(()=>{msg=null;renderMsg();},2600); renderMsg();}

/* ---------- Render ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=st=>st.darts?(st.pts/st.darts*3).toFixed(1):'0.0';
const chipClass=l=>l[0]==='T'?'t':(l[0]==='D'||l==='Bull')?'d':'';

function render(){
  document.getElementById('setup').hidden=!(setupOpen||!state);
  if(setupOpen||!state) renderSetup();
  document.getElementById('game').hidden=!state;
  if(!state) return;
  const cfg=state.config;
  document.getElementById('badge').textContent=cfg.start;
  const parts=[cfg.doubleIn?'Double in':null,cfg.doubleOut?'double out':'straight out'].filter(Boolean).join(', ');
  document.getElementById('rules').innerHTML=`<b>${parts.charAt(0).toUpperCase()+parts.slice(1)}</b><br>${cfg.legsToWin>1?`First to ${cfg.legsToWin} legs, leg ${state.leg}`:'Single leg'}`;
  renderPlayers(); renderPad(); renderModal();
}

function renderPlayers(){
  const cfg=state.config, over=state.legWinner!=null||state.matchWinner!=null;
  document.getElementById('players').innerHTML=state.players.map((p,i)=>{
    const active=i===state.current&&!over;
    let rem=p.remaining,left=3;
    if(active&&state.mode==='darts'&&state.turn.length){const r=evalDarts(p,state.turn); if(!r.bust) rem=r.rem; left=3-state.turn.length;}
    const co=cfg.doubleOut&&p.opened?checkout(rem,active?left:3):null;
    const legs=cfg.legsToWin>1?`<span class="legs" aria-label="${p.legs} legs won">${Array.from({length:cfg.legsToWin},(_,k)=>`<i class="${k<p.legs?'won':''}"></i>`).join('')}</span>`:'';
    return `<section class="player${active?' is-active':''}" ${active?'aria-current="true"':''}>
      <div class="p-name">${esc(p.name)}${legs}${active?'<span class="throwing">to throw</span>':''}</div>
      <div class="p-rem" aria-label="${rem} remaining">${rem}</div>
      <div class="p-meta"><span>Avg ${avg(p.st)}</span><span>Last ${p.last==null?'–':p.last}</span>${active?`<span>Darts ${p.st.darts}</span>`:''}</div>
      ${co?`<div class="co"><span>${active&&left<3?`With ${left} left`:'Checkout'}</span>${co.map(x=>`<b class="${chipClass(x)}">${x}</b>`).join('')}</div>`:''}
      ${!p.opened?'<div class="note">Needs a double to start scoring</div>':''}
    </section>`;
  }).join('');
}

function renderPad(){
  const pad=document.getElementById('pad'), mode=state.mode, p=cur();
  let h=`<div class="seg" role="group" aria-label="Entry mode">
    <button data-mode="total" aria-pressed="${mode==='total'}" ${state.turn.length?'disabled':''}>Turn total</button>
    <button data-mode="darts" aria-pressed="${mode==='darts'}">Dart by dart</button></div>`;
  if(mode==='total'){
    let leaves='',bad=false;
    if(buffer){const v=+buffer,nr=p.remaining-v;
      if(v>180||IMPOSSIBLE.has(v)){leaves='Not possible';bad=true;}
      else if(nr<0||(state.config.doubleOut&&nr===1)){leaves='Bust';bad=true;}
      else if(nr===0) leaves='Checkout';
      else leaves=`Leaves ${nr}`;}
    else leaves=`${esc(p.name)} on ${p.remaining}`;
    h+=`<div class="entry"><div class="buf ${buffer?'':'empty'}" aria-live="polite">${buffer||'Enter turn score'}</div><div class="leaves ${bad?'bad':''}">${leaves}</div></div>
    <div class="grid g5">${QUICK.map(q=>`<button class="k q" data-quick="${q}">${q===0?'None':q}</button>`).join('')}</div>
    <div class="grid g3">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="k" data-num="${n}">${n}</button>`).join('')}
      <button class="k undo" data-act="back" aria-label="Delete digit">⌫</button>
      <button class="k" data-num="0">0</button>
      <button class="k go" data-act="enter" ${buffer?'':'disabled'}>Score</button></div>
    <div class="grid g3"><button class="k undo" data-act="undo" style="grid-column:span 3">Undo last turn</button></div>
    ${!p.opened?'<p class="hint">Enter only the points scored from the opening double onward.</p>':''}`;
  }else{
    const r=state.turn.length?evalDarts(p,state.turn):null;
    h+=`<div class="darts">${[0,1,2].map(i=>{const d=state.turn[i];return `<div class="slot ${d?'full '+chipClass(d.l):''}">${d?d.l:''}</div>`;}).join('')}
      <div class="turn-total" aria-label="Turn total">${r&&!r.bust?r.pts:0}</div></div>
    <div class="mods" role="group" aria-label="Multiplier">${[[1,'Single'],[2,'Double'],[3,'Treble']].map(([m,l])=>`<button data-m="${m}" aria-pressed="${mult===m}">${l}</button>`).join('')}</div>
    <div class="grid g5">${Array.from({length:20},(_,i)=>`<button class="k" data-seg="${i+1}">${i+1}</button>`).join('')}
      <button class="k" data-seg="25" ${mult===3?'disabled':''}>25</button>
      <button class="k" data-seg="50" ${mult===3?'disabled':''}>Bull</button>
      <button class="k small" data-seg="0">Miss</button>
      <button class="k undo" data-act="undo">Undo</button>
      <button class="k small" data-act="endturn" ${state.turn.length?'':'disabled'}>End turn</button></div>
    ${!p.opened?'<p class="hint">Darts count once a double lands.</p>':''}`;
  }
  h+=`<div class="msg" id="msg" role="status" aria-live="polite"></div>`;
  pad.innerHTML=h; renderMsg();
}
function renderMsg(){const el=document.getElementById('msg'); if(!el) return; el.className='msg'+(msg?' '+msg.kind:''); el.textContent=msg?msg.t:'';}

function statsTable(){
  return `<div class="tablewrap"><table><thead><tr><th>Player</th><th>Legs</th><th>Avg</th><th>Best</th><th>100+</th><th>140+</th><th>180</th><th>Top out</th></tr></thead><tbody>
  ${state.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.legs}</td><td>${avg(p.st)}</td><td>${p.st.hi}</td><td>${p.st.t100}</td><td>${p.st.t140}</td><td>${p.st.t180}</td><td>${p.st.hiOut||'–'}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function renderModal(){
  const m=document.getElementById('modal'); let h='';
  if(pending){
    h=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Checkout on ${pending.v}?</h2>
      <p>How many darts did it take?</p>
      <div class="row">${[1,2,3].map(n=>`<button class="btn ${n>=pending.min?'primary':''}" data-co="${n}" ${n<pending.min?'disabled':''}>${n} dart${n>1?'s':''}</button>`).join('')}</div>
      <div class="row">${state.config.doubleOut?'<button class="btn danger" data-act="pbust">Missed the double, bust</button>':''}<button class="btn" data-act="pcancel">Cancel</button></div></div>`;
  }else if(state.matchWinner!=null){
    const w=state.players[state.matchWinner], lc=state.lastCheckout;
    h=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(w.name)} wins${state.config.legsToWin>1?' the match':''}</h2>
      <p>Checked out ${lc.pts} with ${lc.darts} dart${lc.darts>1?'s':''}.</p>${statsTable()}
      <div class="row"><button class="btn primary" data-act="rematch">Rematch, ${esc(state.players[loserIndex()].name)} throws first</button><button class="btn" data-act="new">New game</button></div>
      <div class="row"><button class="btn" data-act="undo">Undo checkout</button></div></div>`;
  }else if(state.legWinner!=null){
    const w=state.players[state.legWinner], lc=state.lastCheckout;
    const nextP=state.players[(state.legStarter+1)%state.players.length];
    h=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Leg ${state.leg} to ${esc(w.name)}</h2>
      <p>Checked out ${lc.pts} with ${lc.darts} dart${lc.darts>1?'s':''}. ${esc(nextP.name)} throws first next leg.</p>${statsTable()}
      <div class="row"><button class="btn primary" data-act="nextleg">Start leg ${state.leg+1}</button></div>
      <div class="row"><button class="btn" data-act="undo">Undo checkout</button></div></div>`;
  }
  m.hidden=!h; m.innerHTML=h;
  if(h){const b=m.querySelector('.btn.primary:not([disabled])'); if(b) b.focus();}
}

function renderSetup(){
  if(!draft) draft=state?{start:state.config.start,doubleOut:state.config.doubleOut,doubleIn:state.config.doubleIn,legsToWin:state.config.legsToWin,names:state.players.map(p=>p.name)}
    :{start:501,doubleOut:true,doubleIn:false,legsToWin:1,names:['Player 1','Player 2']};
  const d=draft;
  document.getElementById('setup').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
    <h2 id="st">New game</h2>
    <div class="field"><span class="lbl">Game</span><div class="chips big">${[301,501,701].map(g=>`<button data-start="${g}" aria-pressed="${d.start===g}">${g}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Legs to win</span><div class="chips">${[1,2,3,4,5].map(g=>`<button data-legs="${g}" aria-pressed="${d.legsToWin===g}">${g}</button>`).join('')}</div></div>
    <div class="field">
      <div class="toggle"><div>Double out<small>Finish exactly on a double or the bull</small></div><button class="switch" role="switch" aria-checked="${d.doubleOut}" data-tog="doubleOut" aria-label="Double out"></button></div>
      <div class="toggle"><div>Double in<small>Scoring starts with a double, common in 301</small></div><button class="switch" role="switch" aria-checked="${d.doubleIn}" data-tog="doubleIn" aria-label="Double in"></button></div>
    </div>
    <div class="field"><span class="lbl">Players, in throwing order</span><div class="names">
      ${d.names.map((n,i)=>`<div><input value="${esc(n)}" data-name="${i}" aria-label="Player ${i+1} name" maxlength="20">${d.names.length>1?`<button data-rm="${i}" aria-label="Remove player ${i+1}">×</button>`:''}</div>`).join('')}
    </div>${d.names.length<6?'<button class="add" data-act="addp">Add player</button>':''}</div>
    <div class="row"><button class="btn primary" data-act="start">Start game</button>${state?'<button class="btn" data-act="cancelsetup">Back to game</button>':''}</div>
  </div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  const ds=b.dataset;
  if(b.id==='newBtn'){draft=null;setupOpen=true;render();return;}
  if(ds.start){draft.start=+ds.start;renderSetup();return;}
  if(ds.legs){draft.legsToWin=+ds.legs;renderSetup();return;}
  if(ds.tog){draft[ds.tog]=!draft[ds.tog];renderSetup();return;}
  if(ds.rm!=null){draft.names.splice(+ds.rm,1);renderSetup();return;}
  if(ds.mode){state.mode=ds.mode;buffer='';mult=1;save();render();return;}
  if(ds.quick!=null){submitTotal(+ds.quick);return;}
  if(ds.num!=null){if(buffer.length<3){buffer=(buffer==='0'?'':buffer)+ds.num;} render();return;}
  if(ds.m){mult=mult===+ds.m?1:+ds.m;renderPad();return;}
  if(ds.seg!=null){addDart(mult,+ds.seg);return;}
  if(ds.co){confirmCheckout(+ds.co);return;}
  switch(ds.act){
    case 'back': buffer=buffer.slice(0,-1); render(); break;
    case 'enter': if(buffer) submitTotal(+buffer); break;
    case 'undo': undo(); break;
    case 'endturn': endTurnEarly(); break;
    case 'pbust': pendingBust(); break;
    case 'pcancel': pending=null; render(); break;
    case 'nextleg': nextLeg(); break;
    case 'rematch': newGame(state.config,loserIndex()); render(); break;
    case 'new': draft=null; setupOpen=true; render(); break;
    case 'addp': draft.names.push('Player '+(draft.names.length+1)); renderSetup();
      setTimeout(()=>{const ins=document.querySelectorAll('[data-name]'); ins[ins.length-1].select();},0); break;
    case 'start': {
      const cfg=clone(draft); cfg.names=cfg.names.map((n,i)=>n.trim()||('Player '+(i+1)));
      setupOpen=false; draft=null; newGame(cfg); render(); break; }
    case 'cancelsetup': setupOpen=false; draft=null; render(); break;
  }
});
document.addEventListener('input',e=>{const i=e.target.dataset&&e.target.dataset.name; if(i!=null&&draft) draft.names[+i]=e.target.value;});
document.addEventListener('keydown',e=>{
  if(!state||setupOpen) return;
  if(e.target.tagName==='INPUT') return;
  if((e.key==='z'&&(e.ctrlKey||e.metaKey))||e.key==='u'){e.preventDefault();undo();return;}
  if(pending){ if(['1','2','3'].includes(e.key)&&+e.key>=pending.min){confirmCheckout(+e.key);} else if(e.key==='Escape'){pending=null;render();} return;}
  if(state.legWinner!=null||state.matchWinner!=null) return;
  if(state.mode!=='total') return;
  if(/^[0-9]$/.test(e.key)){if(buffer.length<3){buffer=(buffer==='0'?'':buffer)+e.key;render();}e.preventDefault();}
  else if(e.key==='Backspace'){buffer=buffer.slice(0,-1);render();e.preventDefault();}
  else if(e.key==='Enter'){if(buffer){submitTotal(+buffer);}e.preventDefault();}
  else if(e.key==='Escape'){buffer='';render();}
});

load(); render();
})();
</script>
</body>
</html>
